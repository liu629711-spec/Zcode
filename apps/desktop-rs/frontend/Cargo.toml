[package]
name = "zcode-desktop-frontend"
version = "0.1.0"
edition = "2024"
description = "ZCode 桌面端前端（Leptos/WASM）"

[[bin]]
name = "frontend"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_meta = "0.8"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlFormElement", "Window", "Element", "HtmlElement", "Storage", "DragEvent", "DataTransfer", "NodeList", "Document"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# 模型回复的 markdown 渲染（纯 Rust，wasm 兼容）。
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
# 工具命令正则（exploreToolCall：只读/写命令判定），wasm 兼容的轻量实现。
regex-lite = "0.1"
