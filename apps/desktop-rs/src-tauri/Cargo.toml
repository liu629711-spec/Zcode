[package]
name = "zcode-desktop-rs"
version = "0.1.0"
edition = "2024"
description = "ZCode 桌面端（Tauri 2 主进程）"

[lib]
# 与 bin 名错开，避免 Windows 下 pdb 输出文件名冲突。
name = "zcode_desktop_rs_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt-multi-thread", "fs"] }
uuid = { version = "1", features = ["v4", "v7"] }
# 本地任务索引库（~/.zcode/v2/tasks-index.sqlite，真源用 node:sqlite）。
# bundled 特性把 SQLite 源码编进来，不依赖系统 sqlite 动态库。
rusqlite = { version = "0.37", features = ["bundled"] }
# wire 分片重组：CRC-32/IEEE 校验 + 标准 base64 解码
# （真源 wire-binary.ts 用标准 CRC-32/IEEE + 严格标准字母表 base64）。
crc32fast = "1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# live 测试要直接开副本库核对 SQL 效果（archived_live.rs）。
rusqlite = { version = "0.37", features = ["bundled"] }
