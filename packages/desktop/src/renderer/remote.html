<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ZCode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* 启动屏底色（首帧防白闪）。**不能在这里写 body 文字色**：那条写死值会活到应用启动后，
         浅色主题下正文全继承它 → 近白字画在浅底上（实测对比 1.15:1，正文看起来"消失"）。
         文字色归应用主题 token（styles.css 的 body 规则），#boot/.boot-hint 各自带自己的色。 */
      body {
        background: #26221e;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        /* 断线时这层会被重新显示，必须自带不透明底与主题文字色，否则消息叠在应用内容上读不出来；
           启动阶段 styles.css 还没加载，var() 落到括号里的启动屏配色。 */
        background: var(--color-background, #26221e);
        color: var(--color-foreground, #a89f92);
        text-align: center;
        padding: 24px;
        white-space: pre-wrap;
      }

      body.zcode-remote-ready #boot {
        display: none;
      }

      .boot-hint {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        /* 这层在应用已就绪后仍挂在界面上（打开工作区等待），必须跟主题 token：
           写死的浅灰在浅色主题下只有 2.3:1，等于又一处"看不见的字"。 */
        color: var(--color-foreground-subtle, #a89f92);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">正在连接工作区…</div>
    <script type="module" src="./src/remote-main.tsx"></script>
  </body>
</html>
