<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ZCode</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      /* 启动屏底色（首帧防白闪）。**不能在这里写 body 文字色**：那条写死值会活到应用启动后，
         浅色主题下正文全继承它 → 近白字画在浅底上（实测对比 1.15:1，正文看起来"消失"）。
         文字色归应用主题 token（styles.css 的 body 规则），#boot/.boot-hint 各自带自己的色。 */
      body {
        background: #26221e;
      }

      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #a89f92;
        text-align: center;
        padding: 24px;
        white-space: pre-wrap;
      }

      body.zcode-remote-ready #boot {
        display: none;
      }

      .boot-hint {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px;
        color: #a89f92;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">正在连接工作区…</div>
    <script type="module" src="./src/remote-main.tsx"></script>
  </body>
</html>
